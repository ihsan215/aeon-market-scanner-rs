[package]
name = "aeon-market-scanner-rs"
version = "0.10.1"
edition = "2024"
rust-version = "1.85"

description = "CEX/DEX market scanner: crypto prices, WebSocket streams and arbitrage, plus US stock prices and fiat exchange rates with provider fallback."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ihsan215/aeon-market-scanner-rs"
homepage = "https://aeonfeed.com"
documentation = "https://docs.rs/aeon-market-scanner-rs"

keywords = ["crypto", "arbitrage", "stocks", "forex", "market-data"]
categories = ["api-bindings", "asynchronous", "finance", "cryptography::cryptocurrencies"]

# Keep the published crate lean and explicit.
include = [
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[package.metadata.docs.rs]
# Document the opt-in providers (YahooFiat, YahooStocks) too.
all-features = true

[features]
default = []
# Yahoo Finance fiat rates and stock prices (`YahooFiat`, `YahooStocks`). Off by default: it uses an undocumented
# Yahoo endpoint that Yahoo's terms do not allow for automated access and may block or change.
unofficial-yahoo = []

[dependencies]
reqwest = { version = "0.12.28", features = ["json"] }
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.48.0", features = ["full"] }
async-trait = "0.1.89"
chrono = "0.4"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
futures = "0.3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
prost = "0.13"
ethers = { version = "2.0", features = ["ws", "rustls"], default-features = false }
dotenvy = "0.15"

[dev-dependencies]
dotenvy = "0.15"